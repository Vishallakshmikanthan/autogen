<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Village World: Cinematic Edition</title>

<style>

.p{position:absolute;background:var(--bg);backdrop-filter:blur(8px);border:1px solid #fff2;border-radius:10px;padding:12px 14px}

.row{display:flex;gap:8px;align-items:center;margin-top:9px;flex-wrap:wrap}

#tip{position:absolute;bottom:calc(12px + env(safe-area-inset-bottom,0px));left:12px;opacity:.75;font-size:12px}
</style></head><body>
<div id="hud" class="p">

<div class="row"><label><input id="auto" type="checkbox">Run day cycle</label><label><input id="lab" type="checkbox" checked>Labels</label><label><input id="fxo" type="checkbox" checked>Cinematic FX</label></div>
<div class="row" id="views"></div>
<div class="row"><button id="exp">Export village_world.json</button></div>
</div>
<div id="info" class="p"></div>
<div id="tip">Drag to orbit · scroll to zoom · right-drag to pan · click a villager</div>

<script>
const T=THREE,G=.3,rnd=Math.random;
const sm=(a,b,x)=>{x=Math.min(1,Math.max(0,(x-a)/(b-a)));return x*x*(3-2*x)};
const hash=(i,j)=>{const s=Math.sin(i*127.1+j*311.7)*43758.5453;return s-Math.floor(s)};
const vn=(x,y)=>{const i=Math.floor(x),j=Math.floor(y),u=x-i,v=y-j,a=u*u*(3-2*u),b=v*v*(3-2*v);return hash(i,j)*(1-a)*(1-b)+hash(i+1,j)*a*(1-b)+hash(i,j+1)*(1-a)*b+hash(i+1,j+1)*a*b};
const fbm=(x,y,o=4)=>{let s=0,a=.5;for(let k=0;k<o;k++){s+=a*vn(x,y);x*=2.03;y*=2.03;a/=2}return s};
const rxf=z=>70+10*Math.sin(z*.03);
const lakes=[[rxf(135),135,22,5],[rxf(-140),-140,22,5],[-75,70,18,3]];
function H(x,z){
 const d=Math.hypot(x,z),far=sm(60,110,d);
 let h=G+far*(fbm(x*.012,z*.012)*16-4)+far*(fbm(x*.08,z*.08,2)-.5)*1.2;
 h+=sm(130,260,d)*(40+(1-Math.abs(fbm(x*.01+9,z*.01+4,5)*2-1))*60);
 const rd=Math.abs(x-rxf(z)),rw=1-sm(105,150,d),m=Math.exp(-((rd/22)**2))*rw*.9;
 h=h*(1-m)+G*m-4.2*Math.exp(-((rd/8)**2))*rw;
 for(const[l,k,R,dp]of lakes){const q=Math.exp(-((x-l)**2+(z-k)**2)/(R*R));h=h*(1-q)+G*q-dp*q}
 return h}
const scene=new T.Scene(),cam=new T.PerspectiveCamera(55,innerWidth/innerHeight,.5,1800);
const ren=new T.WebGLRenderer({antialias:true});ren.setPixelRatio(Math.min(devicePixelRatio,2));ren.setSize(innerWidth,innerHeight);
ren.shadowMap.enabled=true;ren.shadowMap.type=T.PCFSoftShadowMap;document.body.appendChild(ren.domElement);
scene.fog=new T.Fog(0x86c5ee,120,620);scene.background=new T.Color(0x86c5ee);
const ctl=new T.OrbitControls(cam,ren.domElement);ctl.enableDamping=true;ctl.maxPolarAngle=1.5;ctl.minDistance=6;ctl.maxDistance=420;
cam.position.set(110,70,140);ctl.target.set(0,2,0);
const hemi=new T.HemisphereLight(0xcfe8ff,0x4a5a2f,.6),sun=new T.DirectionalLight(0xfff4e0,1.1);scene.add(hemi,sun,sun.target);
sun.castShadow=true;sun.shadow.mapSize.set(4096,4096);Object.assign(sun.shadow.camera,{left:-130,right:130,top:130,bottom:-130,near:10,far:700});
sun.shadow.camera.updateProjectionMatrix();sun.shadow.bias=-.0006;sun.shadow.normalBias=.4;

/* ---------- cinematic core ---------- */
const TU={value:0},PX={value:1},NU={value:0},DU2={value:1};
const NZ3=`float hs3(vec3 p){p=fract(p*.3183099+.1);p*=17.;return fract(p.x*p.y*p.z*(p.x+p.y+p.z));}
float nz3(vec3 p){vec3 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(mix(hs3(i),hs3(i+vec3(1.,0.,0.)),f.x),mix(hs3(i+vec3(0.,1.,0.)),hs3(i+vec3(1.,1.,0.)),f.x),f.y),mix(mix(hs3(i+vec3(0.,0.,1.)),hs3(i+vec3(1.,0.,1.)),f.x),mix(hs3(i+vec3(0.,1.,1.)),hs3(i+vec3(1.,1.,1.)),f.x),f.y),f.z);}`;
function fx(mat,amp,det){
 mat.onBeforeCompile=s=>{
  s.uniforms.uTime=TU;s.uniforms.uAmp={value:amp};
  s.vertexShader='uniform float uTime;uniform float uAmp;varying vec3 vWp;varying float vL;\n'+s.vertexShader.replace('#include <begin_vertex>',`#include <begin_vertex>
#ifdef USE_INSTANCING
mat4 fxM=modelMatrix*instanceMatrix;vec3 ip=instanceMatrix[3].xyz;
#else
mat4 fxM=modelMatrix;vec3 ip=vec3(0.);
#endif
float yy=max(position.y,0.);vL=position.y;
transformed.x+=(sin(uTime*1.6+ip.x*.35+ip.z*.27)+.5*sin(uTime*3.1+ip.x*.9))*uAmp*yy;
transformed.z+=cos(uTime*1.3+ip.z*.4)*uAmp*.6*yy;

  s.fragmentShader='varying vec3 vWp;varying float vL;\n'+NZ3+'\n'+s.fragmentShader.replace('#include <color_fragment>',`#include <color_fragment>
{float a=nz3(vWp*1.7),b=nz3(vWp*6.1),c=nz3(vWp*.07);
diffuseColor.rgb*=(.82+.26*a+.14*b)*(.9+.2*c);
${det==3?'diffuseColor.rgb*=mix(.5,1.,smoothstep(0.,.75,vL));':''}}`)};
 mat.customProgramCacheKey=()=>'fx'+det;
 return mat}
const PN=fx(new T.MeshStandardMaterial({roughness:.9}),.022,1),OKM=fx(new T.MeshStandardMaterial({roughness:.9}),.03,1);
const WUN={uTime:TU,uDep:{value:null},uSun:{value:new T.Vector3(0,1,0)},uSky:{value:new T.Color(0x86c5ee)},uDay:{value:1},fogColor:{value:new T.Color()},fogNear:{value:1},fogFar:{value:2},fogDensity:{value:.00025}};
function waterMat(){
 const N=384,d=new Uint8Array(N*N*4);
 for(let j=0;j<N;j++)for(let i=0;i<N;i++){const x=(i/(N-1)-.5)*SZ,z=(j/(N-1)-.5)*SZ,v=Math.max(0,-1-H(x,z)),k=(j*N+i)*4;d[k]=Math.min(255,v/6*255);d[k+3]=255}
 const t=new T.DataTexture(d,N,N,T.RGBAFormat);t.minFilter=t.magFilter=T.LinearFilter;t.wrapS=t.wrapT=T.ClampToEdgeWrapping;t.needsUpdate=true;WUN.uDep.value=t;
 return new T.ShaderMaterial({transparent:true,depthWrite:false,fog:true,uniforms:WUN,
 vertexShader:`varying vec3 vW;
#include <fog_pars_vertex>
void main(){vec4 wp=modelMatrix*vec4(position,1.);vW=wp.xyz;vec4 mvPosition=viewMatrix*wp;gl_Position=projectionMatrix*mvPosition;
#include <fog_vertex>
}`,
 fragmentShader:`uniform float uTime,uDay;uniform sampler2D uDep;uniform vec3 uSun,uSky;varying vec3 vW;
#include <fog_pars_fragment>
float hs(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float ns(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(hs(i),hs(i+vec2(1.,0.)),f.x),mix(hs(i+vec2(0.,1.)),hs(i+vec2(1.,1.)),f.x),f.y);}
void main(){
 float dp=texture2D(uDep,vW.xz/640.+.5).r*6.;
 vec2 p=vW.xz;float t=uTime;vec2 g=vec2(0.);
 g+=vec2(.9,.4)*cos(dot(p,vec2(.9,.4))*1.1+t*1.4)*.045;
 g+=vec2(-.3,.8)*cos(dot(p,vec2(-.3,.8))*1.7+t*1.9)*.035;
 g+=vec2(.5,-.7)*cos(dot(p,vec2(.5,-.7))*2.9-t*2.3)*.025;
 g+=(vec2(ns(p*.9+t*.2),ns(p*.9-t*.17+9.))-.5)*.12;
 vec3 n=normalize(vec3(-g.x,1.,-g.y));
 vec3 V=normalize(cameraPosition-vW);
 float fr=.03+.97*pow(1.-max(dot(n,V),0.),5.);
 vec3 body=mix(vec3(.2,.62,.6),vec3(.03,.2,.36),smoothstep(0.,3.2,dp))*(.25+.75*uDay);
 vec3 R=reflect(-V,n);
 vec3 refl=mix(uSky,uSky*.55+vec3(.1,.2,.35)*uDay,clamp(R.y*1.5,0.,1.));
 vec3 L=normalize(uSun);
 float sp=pow(max(dot(reflect(-L,n),V),0.),220.)*step(0.,L.y);
 vec3 col=mix(body,refl,clamp(fr,0.,1.))+vec3(1.,.9,.7)*sp*4.;
 float edge=1.-smoothstep(0.,.55,dp);
 float fo=edge*smoothstep(.35,.75,ns(p*2.6+t*.3)+edge*.35);
 col=mix(col,vec3(.95,1.,1.)*(.45+.55*uDay),fo*.85);
 float a=clamp(smoothstep(0.,.18,dp)*(.72+.25*fr)+fo,0.,1.);

#include <fog_fragment>
}`})}
/* ---------- helpers ---------- */
const mats={},M=c=>mats[c]||(mats[c]=fx(new T.MeshStandardMaterial({color:c,roughness:.9}),0,1));
const winMat=new T.MeshStandardMaterial({color:0xffe9a8,emissive:0xffb84a,emissiveIntensity:0});
const B=(w,h,d)=>new T.BoxGeometry(w,h,d),Cy=(a,b,h,s=12)=>new T.CylinderGeometry(a,b,h,s),Sp=(r,s=10)=>new T.SphereGeometry(r,s,8);
const roofG=new T.ConeGeometry(1,1,4).rotateY(Math.PI/4);
function mk(g,m,x,y,z,p){const o=new T.Mesh(typeof m==='number'?M(m):m);o.geometry=g;if(typeof m==='number')o.material=M(m);else o.material=m;o.position.set(x,y,z);o.castShadow=o.receiveShadow=true;(p||scene).add(o);return o}
const c3=new T.Color(),c2=new T.Color(),wh=M(0xffffff);
function inst(geo,mat,items){const m=new T.InstancedMesh(geo,mat,items.length),o=new T.Object3D();
 items.forEach((it,i)=>{o.position.set(it.x,it.y,it.z);o.rotation.set(0,it.r||0,0);o.scale.set(it.s||1,(it.sy||1)*(it.s||1),it.s||1);o.updateMatrix();m.setMatrixAt(i,o.matrix);if(it.c!==undefined)m.setColorAt(i,c3.setHex(it.c))});
 m.castShadow=m.receiveShadow=true;scene.add(m);return m}
function label(txt,sz=1){const cv=document.createElement('canvas');cv.width=512;cv.height=128;const x=cv.getContext('2d');x.font='600 52px Georgia';x.textAlign='center';x.textBaseline='middle';
 const w=x.measureText(txt).width+60;x.fillStyle='rgba(20,22,16,.75)';x.beginPath();x.roundRect((512-w)/2,22,w,84,42);x.fill();x.fillStyle='#f6e3b0';x.fillText(txt,256,66);
 const s=new T.Sprite(new T.SpriteMaterial({map:new T.CanvasTexture(cv),depthTest:false,transparent:true,fog:false}));s.scale.set(16*sz,4*sz,1);s.renderOrder=9;scene.add(s);return s}

/* ---------- terrain, water, sky ---------- */
const SZ=640,SEG=256,tg=new T.PlaneGeometry(SZ,SZ,SEG,SEG);tg.rotateX(-Math.PI/2);
{const P=tg.attributes.position,C=new Float32Array(P.count*3);
 for(let i=0;i<P.count;i++){const x=P.getX(i),z=P.getZ(i),h=H(x,z),n=vn(x*.3,z*.3);P.setY(i,h);
  if(h<-.3)c3.setHex(0x5a4a33);else if(h<.2)c3.setHex(0xcdb982);
  else{c3.setHex(0x6fae43).lerp(c2.setHex(0x4a8a30),n);c3.lerp(c2.setHex(0x2f5f2a),sm(6,18,h));c3.lerp(c2.setHex(0x7a746b),sm(22,34,h+n*6));c3.lerp(c2.setHex(0xf4f7fa),sm(50,62,h+n*8))}
  C.set([c3.r,c3.g,c3.b],i*3)}
 tg.setAttribute('color',new T.BufferAttribute(C,3));tg.computeVertexNormals()}
const terrain=new T.Mesh(tg,fx(new T.MeshStandardMaterial({vertexColors:true,roughness:1}),0,1));terrain.receiveShadow=true;scene.add(terrain);
const water=new T.Mesh(new T.PlaneGeometry(SZ,SZ).rotateX(-Math.PI/2),waterMat());water.position.y=-1;scene.add(water);
const sky=new T.Group();scene.add(sky);
const sunM=new T.Mesh(Sp(16,16),new T.MeshBasicMaterial({color:0xfff2c0,fog:false})),moonM=new T.Mesh(Sp(10,16),new T.MeshBasicMaterial({color:0xdfe8ff,fog:false}));sky.add(sunM,moonM);
const sp=[];for(let i=0;i<900;i++){const a=rnd()*6.283,b=Math.acos(rnd()*.95+.05);sp.push(Math.sin(b)*Math.cos(a)*900,Math.cos(b)*900,Math.sin(b)*Math.sin(a)*900)}
const stars=new T.Points(new T.BufferGeometry().setAttribute('position',new T.Float32BufferAttribute(sp,3)),new T.PointsMaterial({size:2.2,transparent:true,fog:false,opacity:0}));sky.add(stars);
const clouds=[];for(let i=0;i<12;i++){const g=new T.Group();for(let k=0;k<6;k++){const s=new T.Mesh(Sp(10+rnd()*8,8),new T.MeshLambertMaterial({color:0xffffff,transparent:true,opacity:.88,fog:false}));s.position.set(k*13-30,rnd()*4,rnd()*10);s.scale.y=.55;g.add(s)}
 g.position.set(rnd()*900-450,120+rnd()*50,rnd()*900-450);scene.add(g);clouds.push(g)}

/* ---------- village ---------- */
const zones=[],blk=[],lamps=[];
const door=(x,z,a,d)=>[x+Math.sin(a)*d,z+Math.cos(a)*d],face=(x,z)=>Math.atan2(-x,-z);
// cobble square
const cv=document.createElement('canvas');cv.width=cv.height=256;{const x=cv.getContext('2d');x.fillStyle='#a39a88';x.fillRect(0,0,256,256);
 for(let i=0;i<260;i++){x.fillStyle=`hsl(35,${8+rnd()*10}%,${48+rnd()*18}%)`;x.strokeStyle='#5d5648';x.lineWidth=2;x.beginPath();x.roundRect(rnd()*256,rnd()*256,22+rnd()*12,16+rnd()*10,5);x.fill();x.stroke()}}
const cob=new T.CanvasTexture(cv);cob.wrapS=cob.wrapT=T.RepeatWrapping;cob.repeat.set(5,5);
const sq=new T.Mesh(new T.CircleGeometry(14,48).rotateX(-Math.PI/2),new T.MeshStandardMaterial({map:cob,roughness:1,polygonOffset:true,polygonOffsetFactor:-2}));sq.position.y=G+.05;sq.receiveShadow=true;scene.add(sq);
const rim=new T.Mesh(new T.RingGeometry(13,14.2,48).rotateX(-Math.PI/2),new T.MeshStandardMaterial({color:0x6e665a,polygonOffset:true,polygonOffsetFactor:-3}));rim.position.y=G+.07;scene.add(rim);
blk.push({x:0,z:0,r:16});zones.push({id:'town_square',type:'square',x:0,z:0,r:14});
// well
{const g=new T.Group();mk(Cy(2.3,2.5,1.4,20),0x9b9a94,0,G+.7,0,g);mk(new T.CircleGeometry(1.9,20).rotateX(-Math.PI/2),new T.MeshStandardMaterial({color:0x1d4f78,roughness:.1}),0,G+1.2,0,g);
 [-2,2].forEach(s=>mk(B(.3,3.6,.3),0x5b3a22,s,G+2.4,0,g));mk(B(.35,.35,4.6),0x5b3a22,0,G+4.1,0,g);
 [-1,1].forEach(s=>{const r=mk(B(3,.2,3.4),0x7a3b2a,s*1.2,G+4.7,0,g);r.rotation.z=-s*.55});mk(Cy(.35,.3,.5,10),0x7b5a3a,.6,G+2.2,0,g);scene.add(g)}
zones.push({id:'well',type:'well',x:0,z:0,r:3});
// lamps + benches
for(let k=0;k<4;k++){const a=Math.PI/4+k*Math.PI/2,x=Math.cos(a)*11,z=Math.sin(a)*11,g=new T.Group();g.position.set(x,0,z);mk(Cy(.12,.18,4.2,8),0x2b2b2b,0,G+2.1,0,g);mk(Sp(.45),winMat,0,G+4.4,0,g);
 const l=new T.PointLight(0xffc66e,0,30);l.position.set(0,G+4.4,0);g.add(l);lamps.push(l);scene.add(g);
 const b=new T.Group();b.position.set(Math.cos(a+.7)*11.5,0,Math.sin(a+.7)*11.5);b.rotation.y=-(a+.7)+Math.PI/2;mk(B(2.4,.2,.7),0x7a5230,0,G+.7,0,b);mk(B(2.4,.7,.15),0x7a5230,0,G+1.1,-.3,b);[-1,1].forEach(s=>mk(B(.2,.7,.6),0x4a4a4a,s,G+.35,0,b));scene.add(b)}
// houses
function house(x,z,i){const g=new T.Group(),w=6+hash(i,1)*2,d=5+hash(i,2)*2,h=3.4+hash(i,3),wc=[0xe8dcc0,0xd9c9a3,0xcfb99a,0xe6d5b8][i%4],rc=[0x8a3b2a,0x6b4a32,0xa0522d,0x7a5c3a][(i>>1)%4];
 mk(B(w+.4,.5,d+.4),0x8c8a85,0,G+.25,0,g);mk(B(w,h,d),wc,0,G+.5+h/2,0,g);
 [[-1,-1],[1,-1],[-1,1],[1,1]].forEach(([a,b])=>mk(B(.3,h,.3),0x4a3524,a*w/2,G+.5+h/2,b*d/2,g));
 mk(B(w+.1,.25,.2),0x4a3524,0,G+.5+h*.62,d/2+.02,g);
 const r=mk(roofG,rc,0,G+.5+h+1.1,0,g);r.scale.set((w+1.6)/1.414,2.2,(d+1.6)/1.414);
 mk(B(1.2,2.2,.2),0x3e2a1a,-w*.18,G+1.6,d/2+.05,g);[1,2].forEach(s=>mk(B(1,1,.15),winMat,w*(s==1?.25:-.35)+(s==2?.1:0),G+2.6,d/2+.05,g));
 mk(B(.2,1,d*.6),winMat,w/2+.02,G+2.6,0,g);mk(B(.8,2.6,.8),0x8c8a85,w*.25,G+.5+h+1.6,-d*.2,g);
 if(i%2)mk(Cy(.45,.45,.9,10),0x6b4a2a,w/2+.8,G+.45,d*.3,g);
 g.position.set(x,0,z);g.rotation.y=face(x,z);scene.add(g);g.updateMatrixWorld(true);return{x,z,a:face(x,z),dpt:d,ch:g.localToWorld(new T.Vector3(w*.25,G+.5+h+3.1,-d*.2))}}
const huts=[];
for(let i=0;i<80&&huts.length<13;i++){const ang=i*2.399+.4,r=32+hash(i,9)*12,x=Math.cos(ang)*r,z=Math.sin(ang)*r;
 if((z<-16&&Math.abs(x)<48)||x>46||(x>0&&Math.abs(z-5)<10)||(x<0&&Math.abs(z-8)<10)||(z>12&&Math.abs(x)<18)||Math.hypot(x+30,z+16)<17||Math.hypot(x+52,z+34)<16||huts.some(h=>Math.hypot(h.x-x,h.z-z)<12))continue;
 const h=house(x,z,huts.length);h.id='hut_'+huts.length;huts.push(h);blk.push({x,z,r:7});zones.push({id:h.id,type:'hut',x:+x.toFixed(1),z:+z.toFixed(1),r:5})}
// granary
{const x=-30,z=-16,a=face(x,z),g=new T.Group();
