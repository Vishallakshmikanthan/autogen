scenario_id: "5_ablation_arena"
title: "Ablation Arena: Multi-Faculty Cognitive Component Knockouts"
description: "Systematic statistical ablation of Hybrid Cognitive Architecture faculties on held-out worlds. Reports effect sizes (Cohen's d) and scientific verdicts."
environment:
  width: 16
  height: 16
  obstacle_density: 0.15
  resource_density: 0.10
  hazard_density: 0.05
  max_ticks: 45
eval_seeds: [1001, 1002, 1003, 1004, 1005, 1006, 1007, 1008, 1009, 1010, 1011, 1012, 1013, 1014, 1015, 1016, 1017, 1018, 1019, 1020]
ablations:
  - id: "baseline_full"
    name: "Full Hybrid Architecture"
    flags: { enable_memory: true, enable_bayes: true, enable_astar: true, enable_options: true, enable_safety_shield: true }
  - id: "ablate_memory"
    name: "Ablate Spatial Memory"
    flags: { enable_memory: false, enable_bayes: true, enable_astar: true, enable_options: true, enable_safety_shield: true }
  - id: "ablate_bayes"
    name: "Ablate Bayesian Filter"
    flags: { enable_memory: true, enable_bayes: false, enable_astar: true, enable_options: true, enable_safety_shield: true }
  - id: "ablate_shield"
    name: "Ablate Safety Shield"
    flags: { enable_memory: true, enable_bayes: true, enable_astar: true, enable_options: true, enable_safety_shield: false }
  - id: "ablate_astar"
    name: "Ablate A* Deliberation"
    flags: { enable_memory: true, enable_bayes: true, enable_astar: false, enable_options: true, enable_safety_shield: true }

